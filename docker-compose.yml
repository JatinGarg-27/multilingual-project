services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tts_copilot
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  generation-service:
    build: ./services/generation_service
    env_file: ./services/generation_service/.env
    ports:
      - "8001:8001"

  tts-service:
    build: ./services/tts_service
    env_file: ./services/tts_service/.env
    ports:
      - "8002:8002"
    volumes:
      - tts_audio:/app/audio_output

  content-service:
    build: ./services/content_service
    env_file: ./services/content_service/.env
    depends_on:
      - db
      - generation-service
      - tts-service
    ports:
      - "8000:8000"

volumes:
  db_data:
  tts_audio:
